name: CI (Annotaise)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List repo (debug)
        run: |
          pwd
          ls -la
          echo "--- backend ---"
          ls -la backend || true

      - name: Pick compose file name if .yaml
        run: |
          if [ ! -f "$COMPOSE_FILE" ] && [ -f "docker-compose.yaml" ]; then
            echo "COMPOSE_FILE=docker-compose.yaml" >> $GITHUB_ENV
          fi
          echo "Using: ${COMPOSE_FILE:-$COMPOSE_FILE}"

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          DJANGO_DB_NAME=${{ secrets.DJANGO_DB_NAME }}
          DJANGO_DB_USER=${{ secrets.DJANGO_DB_USER }}
          DJANGO_DB_PASS=${{ secrets.DJANGO_DB_PASS }}
          DJANGO_SUPERUSER_USER=${{ secrets.DJANGO_SUPERUSER_USER }}
          DJANGO_SUPERUSER_PASSWORD=${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
          DJANGO_SUPERUSER_EMAIL=${{ secrets.DJANGO_SUPERUSER_EMAIL }}

          EMAIL_HOST=smtp.fake.com
          EMAIL_HOST_USER=fake@example.com
          EMAIL_HOST_PASSWORD=fake
          EMAIL_PORT=587
          DEFAULT_FROM_EMAIL="Annotaise <fake@example.com>"

          FRONTEND_URL=http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          EOF

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Start DB
        run: docker compose --env-file .env -f "$COMPOSE_FILE" up -d --build db

      - name: Wait for Postgres
        run: sleep 10

      - name: Run migrations
        run: docker compose --env-file .env -f "$COMPOSE_FILE" run --rm api uv run python manage.py migrate --noinput

      - name: Run Django tests
        run: docker compose --env-file .env -f "$COMPOSE_FILE" run --rm api uv run python manage.py test -v 2

      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v
