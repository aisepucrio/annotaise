name: PR Title Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest

    steps:
      - name: PR Title Validation
        uses: ytanikin/pr-conventional-commits@1.5.2
        with:
          task_types: '["feat","fix","docs","style","refactor","test","chore"]'
          title_regex: 'ANNOTAISE-\d+'
